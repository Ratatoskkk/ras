<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>rás</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="app" class="app">
    <aside class="rail" id="rail">
      <div class="rail__brand">
        <svg viewBox="0 0 32 32" aria-hidden="true" fill="none">
          <g stroke-width="2.6" stroke-linecap="round">
            <path class="mark__stream" d="M6 9C13 9 15 16 22 16"/>
            <path class="mark__stream mark__stream--mid" d="M6 16h16"/>
            <path class="mark__stream" d="M6 23C13 23 15 16 22 16"/>
          </g>
          <circle class="mark__core" cx="24" cy="16" r="2.8"/>
        </svg>
        <div>
          <div class="rail__wordmark">rás</div>
          <span class="rail__tag">media pipeline</span>
        </div>
        <button class="iconbtn rail__close" id="rail-close" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5 19 19M19 5 5 19"/></svg>
        </button>
      </div>
      <nav class="rail__nav" id="nav"></nav>
      <div class="rail__foot">
        <button class="iconbtn" id="theme-toggle" title="Switch theme" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg>
        </button>
        <span class="rail__version" id="version"></span>
      </div>
    </aside>
    <button class="rail__scrim" id="rail-scrim" aria-label="Close menu" tabindex="-1"></button>

    <div class="main">
      <header class="topbar">
        <button class="iconbtn topbar__menu" id="menu-toggle" aria-label="Menu" aria-controls="rail" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="topbar__title" id="page-title">Dashboard</h1>
        <div class="topbar__status" id="status-strip"></div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true">
      <header class="modal__head">
        <h2 id="modal-title"></h2>
        <button class="iconbtn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5 19 19M19 5 5 19"/></svg>
        </button>
      </header>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
